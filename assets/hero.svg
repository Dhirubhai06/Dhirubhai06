<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Dhirubhai06, Python Django Developer">
  <title>Dhirubhai06 | Python Django Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050d"/>
      <stop offset="1" stop-color="#0b0818"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="880" cy="130" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d4bd8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6d4bd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="160" cy="440" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fa58f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1fa58f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.45" stop-color="#ff4b24"/>
      <stop offset="1" stop-color="#4a0707"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Inter Tight', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .tw { animation: tw 3.2s ease-in-out infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .tw, .pulse { animation: none } }
  </style>

  <!-- space background -->
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#nebulaA)"/>
  <rect width="1200" height="440" fill="url(#nebulaB)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="28" r="1" class="tw" style="animation-delay:.2s"/>
    <circle cx="170" cy="110" r="1.3" class="tw" style="animation-delay:1.1s"/>
    <circle cx="260" cy="40" r="0.9" opacity=".6"/>
    <circle cx="330" cy="130" r="1.1" class="tw" style="animation-delay:2s"/>
    <circle cx="410" cy="60" r="1.4" class="tw" style="animation-delay:.7s"/>
    <circle cx="470" cy="150" r="0.8" opacity=".5"/>
    <circle cx="540" cy="30" r="1" class="tw" style="animation-delay:1.6s"/>
    <circle cx="600" cy="95" r="1.2" opacity=".7"/>
    <circle cx="660" cy="410" r="1" class="tw" style="animation-delay:2.4s"/>
    <circle cx="700" cy="40" r="0.9" opacity=".55"/>
    <circle cx="760" cy="75" r="1.5" class="tw" style="animation-delay:.4s"/>
    <circle cx="820" cy="22" r="1" opacity=".6"/>
    <circle cx="990" cy="35" r="1.2" class="tw" style="animation-delay:1.3s"/>
    <circle cx="1050" cy="85" r="0.9" opacity=".6"/>
    <circle cx="1110" cy="30" r="1.4" class="tw" style="animation-delay:2.2s"/>
    <circle cx="1160" cy="120" r="1" opacity=".5"/>
    <circle cx="1175" cy="300" r="1.1" class="tw" style="animation-delay:.9s"/>
    <circle cx="1130" cy="400" r="1" opacity=".6"/>
    <circle cx="1040" cy="415" r="1.3" class="tw" style="animation-delay:1.8s"/>
    <circle cx="930" cy="420" r="0.9" opacity=".5"/>
    <circle cx="820" cy="405" r="1.2" class="tw" style="animation-delay:.3s"/>
    <circle cx="560" cy="425" r="1" opacity=".5"/>
    <circle cx="470" cy="395" r="1.1" class="tw" style="animation-delay:2.6s"/>
    <circle cx="380" cy="420" r="0.9" opacity=".6"/>
    <circle cx="300" cy="400" r="1.3" class="tw" style="animation-delay:1.5s"/>
    <circle cx="40" cy="260" r="1" opacity=".6"/>
    <circle cx="25" cy="380" r="1.2" class="tw" style="animation-delay:.6s"/>
    <circle cx="620" cy="250" r="0.9" opacity=".5"/>
    <circle cx="590" cy="330" r="1" class="tw" style="animation-delay:2.1s"/>
  </g>
  <circle cx="1090" cy="190" r="1.6" fill="#ff5a2a" class="tw" style="animation-delay:1s"/>
  <circle cx="610" cy="180" r="1.4" fill="#7c6cf0" class="tw" style="animation-delay:1.9s"/>

  <!-- logo box + name -->
  <rect x="60" y="40" width="40" height="34" fill="none" stroke="#5b5b70" stroke-dasharray="3 3"/>
  <text x="80" y="62" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#efe9e1">DA</text>
  <text x="116" y="54" class="mono" font-size="13" font-weight="700" letter-spacing="2.2" fill="#efe9e1">DHIRU BHAI ARANYA</text>
  <text x="116" y="69" class="mono" font-size="8.5" letter-spacing="1.6" fill="#8d8aa3">PYTHON · DJANGO · REST APIs</text>

  <!-- headline -->
  <text x="60" y="150" class="mono" font-size="12" letter-spacing="3" fill="#8d8aa3">PYTHON DJANGO DEVELOPER  ·  BACKEND  ·  REST APIs</text>
  <text x="58" y="232" class="sans" font-size="80" font-weight="300" letter-spacing="-2" fill="#efe9e1">Dhirubhai06</text>
  <text x="60" y="292" class="sans" font-size="30" font-weight="300" fill="#ff5a2a">Python Django Developer</text>
  <text x="60" y="338" class="sans" font-size="19" fill="#9a98aa">Building scalable web apps and REST APIs.</text>
  <text x="60" y="364" class="sans" font-size="15" fill="#7f7c93">Python · Django · DRF · React · PostgreSQL</text>

  <!-- open to work chip -->
  <rect x="60" y="388" width="176" height="34" fill="none" stroke="#3a3a55" stroke-dasharray="3 3"/>
  <circle cx="82" cy="405" r="4" fill="#2ee59d" class="pulse"/>
  <text x="96" y="409" class="mono" font-size="11" letter-spacing="2.4" fill="#efe9e1">OPEN TO WORK</text>

  <!-- orbit rings (center 880,225) -->
  <ellipse cx="880" cy="225" rx="260" ry="118" fill="none" stroke="#7c6cf0" stroke-opacity=".5"/>
  <ellipse cx="880" cy="225" rx="190" ry="86" fill="none" stroke="#22d3a0" stroke-opacity=".5"/>
  <ellipse cx="880" cy="225" rx="128" ry="58" fill="none" stroke="#ff9a3c" stroke-opacity=".5" stroke-dasharray="3 5"/>

  <!-- planet -->
  <circle cx="880" cy="225" r="84" fill="#ff3b1f" opacity=".5" filter="url(#blur)"/>
  <circle cx="880" cy="225" r="52" fill="url(#planet)"/>
  <ellipse cx="866" cy="206" rx="20" ry="12" fill="#ffd6a0" opacity=".18"/>

  <!-- small dot on inner ring -->
  <circle r="4" fill="#ff9a3c">
    <animateMotion dur="14s" repeatCount="indefinite" path="M 1008 225 A 128 58 0 1 1 752 225 A 128 58 0 1 1 1008 225 Z"/>
  </circle>

  <!-- chip: Python -->
  <g>
    <animateMotion dur="44s" repeatCount="indefinite" path="M 1140 225 A 260 118 0 1 1 620 225 A 260 118 0 1 1 1140 225 Z"/>
    <rect x="-56" y="-18" width="112" height="36" rx="18" fill="#0d0b1c" fill-opacity=".92" stroke="#7c6cf0" stroke-opacity=".8"/>
    <circle cx="-36" cy="0" r="11" fill="#7c6cf0"/>
    <text x="-36" y="4" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0b0818">Py</text>
    <text x="-18" y="-1" class="sans" font-size="13" font-weight="600" fill="#efe9e1">Python</text>
    <text x="-18" y="11" class="mono" font-size="7.5" letter-spacing="1.2" fill="#8d8aa3">LANGUAGE</text>
  </g>

  <!-- chip: React -->
  <g>
    <animateMotion dur="44s" begin="-22s" repeatCount="indefinite" path="M 1140 225 A 260 118 0 1 1 620 225 A 260 118 0 1 1 1140 225 Z"/>
    <rect x="-56" y="-18" width="112" height="36" rx="18" fill="#0d0b1c" fill-opacity=".92" stroke="#f2c94c" stroke-opacity=".8"/>
    <circle cx="-36" cy="0" r="11" fill="#f2c94c"/>
    <text x="-36" y="4" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0b0818">Re</text>
    <text x="-18" y="-1" class="sans" font-size="13" font-weight="600" fill="#efe9e1">React</text>
    <text x="-18" y="11" class="mono" font-size="7.5" letter-spacing="1.2" fill="#8d8aa3">FRONTEND</text>
  </g>

  <!-- chip: Django -->
  <g>
    <animateMotion dur="32s" begin="-8s" repeatCount="indefinite" path="M 1070 225 A 190 86 0 1 1 690 225 A 190 86 0 1 1 1070 225 Z"/>
    <rect x="-56" y="-18" width="112" height="36" rx="18" fill="#0d0b1c" fill-opacity=".92" stroke="#22d3a0" stroke-opacity=".8"/>
    <circle cx="-36" cy="0" r="11" fill="#22d3a0"/>
    <text x="-36" y="4" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0b0818">Dj</text>
    <text x="-18" y="-1" class="sans" font-size="13" font-weight="600" fill="#efe9e1">Django</text>
    <text x="-18" y="11" class="mono" font-size="7.5" letter-spacing="1.2" fill="#8d8aa3">BACKEND</text>
  </g>

  <!-- chip: SQL -->
  <g>
    <animateMotion dur="32s" begin="-24s" repeatCount="indefinite" path="M 1070 225 A 190 86 0 1 1 690 225 A 190 86 0 1 1 1070 225 Z"/>
    <rect x="-56" y="-18" width="112" height="36" rx="18" fill="#0d0b1c" fill-opacity=".92" stroke="#ff5a2a" stroke-opacity=".8"/>
    <circle cx="-36" cy="0" r="11" fill="#ff5a2a"/>
    <text x="-36" y="4" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0b0818">DB</text>
    <text x="-18" y="-1" class="sans" font-size="13" font-weight="600" fill="#efe9e1">SQL</text>
    <text x="-18" y="11" class="mono" font-size="7.5" letter-spacing="1.2" fill="#8d8aa3">DATABASE</text>
  </g>

  <!-- caption under orbit -->
  <rect x="770" y="378" width="220" height="26" fill="#0b0818" fill-opacity=".7" stroke="#3a3a55" stroke-dasharray="3 3"/>
  <text x="880" y="395" text-anchor="middle" class="mono" font-size="9.5" letter-spacing="2" fill="#8d8aa3">API → DATABASE → UI</text>
</svg>
